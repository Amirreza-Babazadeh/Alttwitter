name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days to prevent free tier pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Supabase Project
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "Sending keep-alive request to Supabase REST endpoint..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/twitts?select=id&limit=1")
            echo "Response HTTP Status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "Keep-alive ping successful. Supabase database is active."
            else
              echo "Ping returned non-2xx status ($HTTP_STATUS). Check project status in dashboard."
            fi
          else
            echo "Secrets NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY are not configured in GitHub repository secrets."
            echo "Add them to Settings -> Secrets and variables -> Actions to enable keep-alive pings."
          fi
